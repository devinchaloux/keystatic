# FORK (devinchaloux): the release's checks (type-check, lint, the package's
# tests), without the build, for a pull request into `devinchaloux` or on
# demand from the Actions tab.
#
# Not on every push (Devin, 2026-10-14: not every check needs to run every
# time). The release workflow already runs these same checks before it
# publishes, so nothing reaches the site untested; a push that doesn't bump
# `forkRelease` is work in progress, and running them there too only
# repeated the release's work.
name: Fork CI

on:
  pull_request:
    branches:
      - devinchaloux
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-deps

      - name: TypeScript
        run: pnpm check:types

      - name: ESLint (the package this fork changes)
        run: pnpm exec eslint packages/keystatic/src

      # The `keystatic` project only; see the note in fork-release.yml.
      - name: Unit tests
        run: pnpm exec vitest run --project keystatic
