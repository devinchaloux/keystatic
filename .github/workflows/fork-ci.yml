# FORK (devinchaloux): check every push to the fork's branch, so a broken
# change shows up here, in minutes, rather than as a failed release.
#
# Upstream's own CI (tests.yml) only runs on `main` and pull requests, and
# `main` is kept as an untouched mirror of upstream, so none of it runs on our
# changes. This runs the same checks the release does, minus the build.
name: Fork CI

on:
  push:
    branches:
      - devinchaloux
  pull_request:
    branches:
      - devinchaloux

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-deps

      - name: TypeScript
        run: pnpm check:types

      - name: ESLint (the package this fork changes)
        run: pnpm exec eslint packages/keystatic/src

      # The `keystatic` project only; see the note in fork-release.yml.
      - name: Unit tests
        run: pnpm exec vitest run --project keystatic
